name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Tests von ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B test
        env:
          SPRING_PROFILES_ACTIVE: h2